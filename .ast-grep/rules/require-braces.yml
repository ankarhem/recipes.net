id: require-braces
language: CSharp
rule:
  any:
    - kind: if_statement
      not:
        has:
          kind: block
          field: consequence
    - all:
        - kind: if_statement
        - not:
            any:
              - has:
                  kind: block
                  field: alternative
              - has:
                  kind: if_statement
                  field: alternative
        - regex: "else"
    - kind: for_statement
      not:
        has:
          kind: block
          field: body
    - kind: foreach_statement
      not:
        has:
          kind: block
          field: body
    - kind: while_statement
      not:
        has:
          kind: block
          field: body
message: control flow statements must always use braces
severity: error
